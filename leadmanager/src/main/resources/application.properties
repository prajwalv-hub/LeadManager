spring.application.name=leadmanager

spring.datasource.url=jdbc:postgresql://localhost:5432/leadmanager
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:default-verify-token}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}